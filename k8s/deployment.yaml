apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruit-freshness-api
  namespace: default
  labels:
    app: fruit-freshness-api
    tier: backend
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fruit-freshness-api
  template:
    metadata:
      labels:
        app: fruit-freshness-api
        tier: backend
    spec:
      containers:
      - name: freshness-api
        image: uchiaobito004/fruit-freshness-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "300m"
            memory: "800Mi"
          limits:
            cpu: "1500m"
            memory: "2000Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
