apiVersion: v1
kind: Service
metadata:
  name: fruit-freshness-service
  namespace: default
  labels:
    app: fruit-freshness-api
spec:
  type: LoadBalancer
  selector:
    app: fruit-freshness-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fruit-freshness-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fruit-freshness-service
            port:
              number: 80
