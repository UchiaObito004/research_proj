version: '3.8'

services:
  api:
    build: .
    container_name: freshness-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fruit-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: freshness-app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/predict
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fruit-network

networks:
  fruit-network:
    driver: bridge
